# testo2c — 3-node OrbitalC2Core simulation cluster with HTTPS
#
# Starts:  1 Caddy TLS proxy         (ports 35581–35583, 35591–35593)
#          3 orbital-node instances  (internal only)
#          3 adp-adapters            (internal only)
#          3 sim-agents              (internal only)
#          1 NATS JetStream          (internal only)
#
# All external ports are above 35500. Caddy terminates TLS using its
# built-in local CA (self-signed). To suppress browser warnings once:
#   docker compose exec caddy caddy trust
#
# Usage:
#   docker compose up
#
# Service URLs (HTTPS):
#   https://localhost:35581/app/   OrbitalC2Core node 1
#   https://localhost:35582/app/   OrbitalC2Core node 2
#   https://localhost:35583/app/   OrbitalC2Core node 3
#   https://localhost:35591/sim/status   sim-agent-1 control
#   https://localhost:35592/sim/status   sim-agent-2 control
#   https://localhost:35593/sim/status   sim-agent-3 control

services:

  # ── NATS JetStream (inter-node sync, internal only) ─────────────────────────
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["--js", "--http_port", "8222"]
    networks: [sim]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── OrbitalC2Core nodes (no direct host ports — served via Caddy) ────────────
  orbital-node1:
    image: cndrbrbr/orbital2core:latest
    restart: unless-stopped
    environment:
      NODE_ID:       "00000000-0000-0000-0000-000000000001"
      NATS_URL:      "nats://nats:4222"
      MAP_CENTER:    "51.163375,10.447683"
      SIT_ID:        "sim"
      BASEMAPS_FILE: "/basemaps.yaml"
    volumes:
      - node1-data:/data
      - ./basemaps.yaml:/basemaps.yaml:ro
    networks: [sim]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  orbital-node2:
    image: cndrbrbr/orbital2core:latest
    restart: unless-stopped
    environment:
      NODE_ID:       "00000000-0000-0000-0000-000000000002"
      NATS_URL:      "nats://nats:4222"
      MAP_CENTER:    "51.163375,10.447683"
      SIT_ID:        "sim"
      BASEMAPS_FILE: "/basemaps.yaml"
    volumes:
      - node2-data:/data
      - ./basemaps.yaml:/basemaps.yaml:ro
    networks: [sim]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  orbital-node3:
    image: cndrbrbr/orbital2core:latest
    restart: unless-stopped
    environment:
      NODE_ID:       "00000000-0000-0000-0000-000000000003"
      NATS_URL:      "nats://nats:4222"
      MAP_CENTER:    "51.163375,10.447683"
      SIT_ID:        "sim"
      BASEMAPS_FILE: "/basemaps.yaml"
    volumes:
      - node3-data:/data
      - ./basemaps.yaml:/basemaps.yaml:ro
    networks: [sim]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── ADP adapters (internal only) ─────────────────────────────────────────────
  adp-adapter-1:
    image: cndrbrbr/orbital2core-adp:latest
    restart: unless-stopped
    environment:
      ORBITAL_SERVER: "http://orbital-node1:8080"
      ADP_LISTEN:     ":9180"
    networks: [sim]
    depends_on:
      orbital-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  adp-adapter-2:
    image: cndrbrbr/orbital2core-adp:latest
    restart: unless-stopped
    environment:
      ORBITAL_SERVER: "http://orbital-node2:8080"
      ADP_LISTEN:     ":9180"
    networks: [sim]
    depends_on:
      orbital-node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  adp-adapter-3:
    image: cndrbrbr/orbital2core-adp:latest
    restart: unless-stopped
    environment:
      ORBITAL_SERVER: "http://orbital-node3:8080"
      ADP_LISTEN:     ":9180"
    networks: [sim]
    depends_on:
      orbital-node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Simulation agents (internal only, accessed via Caddy) ────────────────────
  sim-agent-1:
    image: cndrbrbr/testo2c-sim-agent:latest
    restart: unless-stopped
    environment:
      AGENT_ID:          "1"
      OWN_ORBITAL_URL:   "http://orbital-node1:8080"
      ALL_ORBITAL_URLS:  "http://orbital-node1:8080,http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ORBITAL_URLS: "http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ADP_URLS:     "http://adp-adapter-2:9180,http://adp-adapter-3:9180"
      SCENARIO:          "central-europe"
      SIM_INTERVAL:      "3"
      SIM_BURST:         "10"
      SIM_AUTOSTART:     "true"
    networks: [sim]
    depends_on:
      orbital-node1:
        condition: service_healthy
      adp-adapter-2:
        condition: service_healthy
      adp-adapter-3:
        condition: service_healthy

  sim-agent-2:
    image: cndrbrbr/testo2c-sim-agent:latest
    restart: unless-stopped
    environment:
      AGENT_ID:          "2"
      OWN_ORBITAL_URL:   "http://orbital-node2:8080"
      ALL_ORBITAL_URLS:  "http://orbital-node1:8080,http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ORBITAL_URLS: "http://orbital-node1:8080,http://orbital-node3:8080"
      PEER_ADP_URLS:     "http://adp-adapter-1:9180,http://adp-adapter-3:9180"
      SCENARIO:          "central-europe"
      SIM_INTERVAL:      "3"
      SIM_BURST:         "10"
      SIM_AUTOSTART:     "true"
    networks: [sim]
    depends_on:
      orbital-node2:
        condition: service_healthy
      adp-adapter-1:
        condition: service_healthy
      adp-adapter-3:
        condition: service_healthy

  sim-agent-3:
    image: cndrbrbr/testo2c-sim-agent:latest
    restart: unless-stopped
    environment:
      AGENT_ID:          "3"
      OWN_ORBITAL_URL:   "http://orbital-node3:8080"
      ALL_ORBITAL_URLS:  "http://orbital-node1:8080,http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ORBITAL_URLS: "http://orbital-node1:8080,http://orbital-node2:8080"
      PEER_ADP_URLS:     "http://adp-adapter-1:9180,http://adp-adapter-2:9180"
      SCENARIO:          "central-europe"
      SIM_INTERVAL:      "3"
      SIM_BURST:         "10"
      SIM_AUTOSTART:     "true"
    networks: [sim]
    depends_on:
      orbital-node3:
        condition: service_healthy
      adp-adapter-1:
        condition: service_healthy
      adp-adapter-2:
        condition: service_healthy

  # ── Caddy TLS proxy ──────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "35581:35581"   # HTTPS → orbital-node1
      - "35582:35582"   # HTTPS → orbital-node2
      - "35583:35583"   # HTTPS → orbital-node3
      - "35591:35591"   # HTTPS → sim-agent-1 control
      - "35592:35592"   # HTTPS → sim-agent-2 control
      - "35593:35593"   # HTTPS → sim-agent-3 control
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [sim]
    depends_on:
      orbital-node1:
        condition: service_healthy
      orbital-node2:
        condition: service_healthy
      orbital-node3:
        condition: service_healthy

volumes:
  node1-data:
  node2-data:
  node3-data:
  caddy-data:
  caddy-config:

networks:
  sim:
    driver: bridge
