# testo2c — 3-node OrbitalC2Core simulation cluster
#
# Base stack — no Caddy, no exposed ports.
# Combine with one of the Caddy override files to get external access:
#
#   Internal Caddy (self-signed, local dev):
#     docker compose -f docker-compose.yml -f docker-compose.caddy-internal.yml up
#
#   External Caddy (Let's Encrypt, production):
#     docker compose -f docker-compose.yml -f docker-compose.caddy-external.yml up
#     (requires the caddy-proxy stack to be running first)

services:

  # ── NATS JetStream (inter-node sync) ─────────────────────────────────────────
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["--js", "--http_port", "8222"]
    networks: [sim]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── OrbitalC2Core nodes ───────────────────────────────────────────────────────
  orbital-node1:
    image: cndrbrbr/orbital2core:latest
    restart: unless-stopped
    environment:
      NODE_ID:       "00000000-0000-0000-0000-000000000001"
      NATS_URL:      "nats://nats:4222"
      MAP_CENTER:    "51.163375,10.447683"
      SIT_ID:        "sim"
      BASEMAPS_FILE: "/basemaps.yaml"
    volumes:
      - node1-data:/data
      - ./basemaps.yaml:/basemaps.yaml:ro
    networks: [sim]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  orbital-node2:
    image: cndrbrbr/orbital2core:latest
    restart: unless-stopped
    environment:
      NODE_ID:       "00000000-0000-0000-0000-000000000002"
      NATS_URL:      "nats://nats:4222"
      MAP_CENTER:    "51.163375,10.447683"
      SIT_ID:        "sim"
      BASEMAPS_FILE: "/basemaps.yaml"
    volumes:
      - node2-data:/data
      - ./basemaps.yaml:/basemaps.yaml:ro
    networks: [sim]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  orbital-node3:
    image: cndrbrbr/orbital2core:latest
    restart: unless-stopped
    environment:
      NODE_ID:       "00000000-0000-0000-0000-000000000003"
      NATS_URL:      "nats://nats:4222"
      MAP_CENTER:    "51.163375,10.447683"
      SIT_ID:        "sim"
      BASEMAPS_FILE: "/basemaps.yaml"
    volumes:
      - node3-data:/data
      - ./basemaps.yaml:/basemaps.yaml:ro
    networks: [sim]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── ADP adapters ──────────────────────────────────────────────────────────────
  adp-adapter-1:
    image: cndrbrbr/orbital2core-adp:latest
    restart: unless-stopped
    environment:
      ORBITAL_SERVER: "http://orbital-node1:8080"
      ADP_LISTEN:     ":9180"
    networks: [sim]
    depends_on:
      orbital-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  adp-adapter-2:
    image: cndrbrbr/orbital2core-adp:latest
    restart: unless-stopped
    environment:
      ORBITAL_SERVER: "http://orbital-node2:8080"
      ADP_LISTEN:     ":9180"
    networks: [sim]
    depends_on:
      orbital-node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  adp-adapter-3:
    image: cndrbrbr/orbital2core-adp:latest
    restart: unless-stopped
    environment:
      ORBITAL_SERVER: "http://orbital-node3:8080"
      ADP_LISTEN:     ":9180"
    networks: [sim]
    depends_on:
      orbital-node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Simulation agents ─────────────────────────────────────────────────────────
  sim-agent-1:
    image: cndrbrbr/testo2c-sim-agent:latest
    restart: unless-stopped
    environment:
      AGENT_ID:          "1"
      OWN_ORBITAL_URL:   "http://orbital-node1:8080"
      ALL_ORBITAL_URLS:  "http://orbital-node1:8080,http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ORBITAL_URLS: "http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ADP_URLS:     "http://adp-adapter-2:9180,http://adp-adapter-3:9180"
      SCENARIO:          "central-europe"
      SIM_INTERVAL:      "3"
      SIM_BURST:         "10"
      SIM_AUTOSTART:     "true"
    networks: [sim]
    depends_on:
      orbital-node1:
        condition: service_healthy
      adp-adapter-2:
        condition: service_healthy
      adp-adapter-3:
        condition: service_healthy

  sim-agent-2:
    image: cndrbrbr/testo2c-sim-agent:latest
    restart: unless-stopped
    environment:
      AGENT_ID:          "2"
      OWN_ORBITAL_URL:   "http://orbital-node2:8080"
      ALL_ORBITAL_URLS:  "http://orbital-node1:8080,http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ORBITAL_URLS: "http://orbital-node1:8080,http://orbital-node3:8080"
      PEER_ADP_URLS:     "http://adp-adapter-1:9180,http://adp-adapter-3:9180"
      SCENARIO:          "central-europe"
      SIM_INTERVAL:      "3"
      SIM_BURST:         "10"
      SIM_AUTOSTART:     "true"
    networks: [sim]
    depends_on:
      orbital-node2:
        condition: service_healthy
      adp-adapter-1:
        condition: service_healthy
      adp-adapter-3:
        condition: service_healthy

  sim-agent-3:
    image: cndrbrbr/testo2c-sim-agent:latest
    restart: unless-stopped
    environment:
      AGENT_ID:          "3"
      OWN_ORBITAL_URL:   "http://orbital-node3:8080"
      ALL_ORBITAL_URLS:  "http://orbital-node1:8080,http://orbital-node2:8080,http://orbital-node3:8080"
      PEER_ORBITAL_URLS: "http://orbital-node1:8080,http://orbital-node2:8080"
      PEER_ADP_URLS:     "http://adp-adapter-1:9180,http://adp-adapter-2:9180"
      SCENARIO:          "central-europe"
      SIM_INTERVAL:      "3"
      SIM_BURST:         "10"
      SIM_AUTOSTART:     "true"
    networks: [sim]
    depends_on:
      orbital-node3:
        condition: service_healthy
      adp-adapter-1:
        condition: service_healthy
      adp-adapter-2:
        condition: service_healthy

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  sim:
    driver: bridge
